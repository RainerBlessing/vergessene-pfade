name: macOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v7

      - name: SDL3 bereitstellen
        shell: bash
        run: |
          if [ ! -f vendor/SDL3-3.2.28/CMakeLists.txt ]; then
            mkdir -p vendor
            curl --fail --location --retry 3 \
              https://github.com/libsdl-org/SDL/releases/download/release-3.2.28/SDL3-3.2.28.tar.gz \
              -o "$RUNNER_TEMP/SDL3.tar.gz"
            tar -xzf "$RUNNER_TEMP/SDL3.tar.gz" -C vendor
          fi

      - name: Konfigurieren
        run: |
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DVP_VENDORED_SDL=ON \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Spiel und Tests bauen
        run: cmake --build build-macos --parallel 3

      - name: Spiellogik testen
        run: |
          ctest --test-dir build-macos \
            --output-on-failure -R '^(core|complete_journey)$'

      - name: App zusammenstellen
        shell: bash
        run: |
          APP="dist/Die vergessenen Pfade.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build-macos/vergessene_pfade "$APP/Contents/MacOS/"
          cp -R assets "$APP/Contents/Resources/"

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          info = {
              "CFBundleName": "Die vergessenen Pfade",
              "CFBundleDisplayName": "Die vergessenen Pfade",
              "CFBundleExecutable": "vergessene_pfade",
              "CFBundleIdentifier": "de.rainerblessing.vergessene-pfade",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "0.1.0",
              "CFBundleVersion": "1",
              "LSMinimumSystemVersion": "11.0",
              "NSHighResolutionCapable": True,
          }
          path = Path("dist/Die vergessenen Pfade.app/Contents/Info.plist")
          path.write_bytes(plistlib.dumps(info))
          PY

          lipo -verify_arch arm64 x86_64 \
            "$APP/Contents/MacOS/vergessene_pfade"
          codesign --force --sign - "$APP"
          codesign --verify --strict "$APP"
          ditto -c -k --keepParent "$APP" dist/vergessene-pfade-macos.zip

      - name: Download bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: vergessene-pfade-macos
          path: dist/vergessene-pfade-macos.zip
          if-no-files-found: error
          retention-days: 14
